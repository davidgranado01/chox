log4j.appender.R=org.apache.log4j.RollingFileAppender
log4j.appender.R.File=${catalina.home}/logs/idaschox.log
log4j.appender.R.MaxFileSize=10MB
log4j.appender.R.MaxBackupIndex=10
log4j.appender.R.layout=org.apache.log4j.PatternLayout
log4j.appender.R.layout.ConversionPattern=%d{dd MMM yyyy HH:mm:ss} %p %t %c - %m%n

log4j.logger.chox=DEBUG, R

log4j.appender.H=org.apache.log4j.RollingFileAppender
log4j.appender.H.File=${catalina.home}/logs/idaschox-hibernate.log
log4j.appender.H.MaxFileSize=10MB
log4j.appender.H.MaxBackupIndex=10
log4j.appender.H.layout=org.apache.log4j.PatternLayout
log4j.appender.H.layout.ConversionPattern=%d{dd MMM yyyy HH:mm:ss} %p %t %c - %m%n

log4j.logger.org.hibernate=INFO, H
#log4j.additivity.org.hibernate.SQL=false
log4j.additivity.org.hibernate.SQL=true
#log4j.logger.org.hibernate.SQL=ERROR
log4j.logger.org.hibernate.SQL=DEBUG

log4j.appender.S=org.apache.log4j.RollingFileAppender
log4j.appender.S.File=${catalina.home}/logs/idaschox-springstruts.log
log4j.appender.S.MaxFileSize=10MB
log4j.appender.S.MaxBackupIndex=10
log4j.appender.S.layout=org.apache.log4j.PatternLayout
log4j.appender.S.layout.ConversionPattern=%d{dd MMM yyyy HH:mm:ss} %p %t %c - %m%n

log4j.logger.com.opensymphony=INFO, S
log4j.logger.org.apache.struts2=INFO, S
log4j.logger.org.acegisecurity=INFO, S
log4j.logger.org.springframework=INFO, S





