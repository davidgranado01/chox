###### SETTINGS ######
#Development flag: controls the load of a minimazed content.
development = false
#Controls the scheduler jobs
scheduler.active = false
# HPI check - should be set to true only in production
hpi.active = false
# Event Generation - defines whether CHOX external events should be generated and added to the CHOX.Events topic
events.active = false
events.log = true
# When events.guava is false, use MBassador event bus implementation
events.guava = false

#The version of the files generated with the yui-aggregator - change when JavaScript libraries are updated
#This applies to local aggregated JavaScript and CSS application files
