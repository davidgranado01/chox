######################
version.number=8.24.36
batch.version.number=8.24.36
db.version.number=8.24.36
######################
###### SETTINGS ######
#Development flag: controls the load of a minimazed content.
development=false
#Controls the scheduler jobs
scheduler.active=true
scheduler.email.active=#{GMAIL_ACTIVE}
# HPI check - should be set to true only in production
hpi.active=#{HPI_ACTIVE}
# Event Generation - defines whether CHOX external events should be generated and added to the CHOX.Events topic
events.active = false
# Should internal events be logged in the event_log table
events.log = true
# For internal events, when events.guava is false, use MBassador event bus implementation
events.guava = false

#clamscan.location = /usr/bin/clamscan
clamscan.location =

#The version of the files generated with the yui-aggregator - change when JavaScript libraries are updated
#This applies to local aggregated JavaScript and CSS application files
js.aggregator.choxall=1.22
#This applies to aggregates JavaScript and CSS libraries
js.aggregator.libs=1.22

#Database parameters
db.url = jdbc:postgresql://#{DB_HOST}:5432/#{DB_NAME.CHOX}
db.maxPoolSize = 20
db.user = #{DB_USER.CHOX_USER}
db.user_password = #{DB_PASS.CHOX_USER}

#Report database parameters
db.maxReportPoolSize = 8
db.mi_user = #{DB_USER.CHOX_MI}
db.mi_user_password = #{DB_PASS.CHOX_MI}

## Not currently used
#ActiveMQ database parameters
#db.maxActiveMQPoolSize = 1
#db.amq_user = #{DB_USER.CHOX_AMQ}
#db.amq_user_password = #{DB_PASS.CHOX_AMQ}

#Activates Web Services
#ws.active = false

######## Type of Install: controls which logging configuration will be used, together with string prefix for automation/scheduler email subject ##########
HOSTNAME = #{ENV_PREFIX}

######## GDPR parameters ##########
gdpr.hashData = #{GDPR_FLAG}
gdpr.hashDataPeriod = 90
gdpr.closeClaims = #{GDPR_FLAG}
gdpr.closeClaimsPeriod = 2555
gdpr.removeNotes = #{GDPR_FLAG}
gdpr.removeNotesPeriod = 1095
gdpr.removeAttachments = #{GDPR_FLAG}
gdpr.removeAttachmentsPeriod = 1095
gdpr.removeTasks = #{GDPR_FLAG}
gdpr.removeTasksPeriod = 1095
gdpr.deactivateUsers = #{GDPR_FLAG}
gdpr.deactivateUsersPeriod = 365
gdpr.hashUserData = #{GDPR_FLAG}
gdpr.hashUserDataPeriodFromDeactivate = 365
gdpr.hashUserDataPeriodFromLastLogin = 730
gdpr.hashVrns = #{GDPR_FLAG}
gdpr.hashVrnsPeriodFromCreation = 2555
gdpr.hashVrnsPeriodFromClosure = 1095


# Email address to send support requests and BRE Band notification emails
onlineSupportDefaultEmail=#{SUPPORT_EMAIL}
smtpEmailUser = #{SMTP_EMAIL}

#ACTIVITY MONITORING PROPERTIES
activity_monitor_enabled = true
activity_monitor_request_interval = 5000

#Email on new BreBand creation for non CHOX Admin

emailOnBreBandCreation = #{BREBAND_EMAIL}
emailReceivers = MichaelPaul.Kemp@audatex.co.uk

# Keoghs Properties
#    security token
keoghs.token = 5DF5864C-5E79-481F-9188-38BF4013D84C

#    timeout period for requests
keoghs.timeout = 1
#    max number of queued requests to send per invocation before checking for results. Use -1 to disable (i.e. process all new queued requests)
#           note that processing requests at the debug endpoint can take several minutes, so tune carefully when using thus!
keoghs.maxQueuedRequests = 5
#    maximum number of claims submitted to keoghs and pending a result (fraud_check_status=2)
keoghs.maxPendingRequests = 20
#    max number of calls to get the claim score. Onnce this number has past, the request will be requeued
keoghs.maxAttempts = 20
#    max number of times a claim is requeued (after maxAttempts at getting score) before giving up
keoghs.maxRequeues = 3

#    activate SOAP logging
keoghs.logSoap = true
#    use debug endpoint or not: note debug endpoint only available on Keoghs UAT server. Therefore, if set to true,
#                                the keoghs pom must have the wsdlLocation pointing to the UAT debug endpoint
keoghs.useDebugEndpoint = false

keoghsReceiver = #{KEOGHS_EMAIL}
keoghsBccReceiver = DL-UK-AX-Penguin@audatex.co.uk
